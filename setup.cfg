[metadata]
name = neomixer
version = attr: neomixer.settings.VERSION
description = A PipeWire virtual mixer with per-input EQ and remembered app routing
long_description = file: README.md
long_description_content_type = text/markdown
author = NeoMixer contributors, based on Pulsemeeter by Gabriel Carneiro
license = MIT
license_files = LICENSE
keywords = audio, mixing, mixer
classifiers =
    Programming Language :: Python :: 3
	Operating System :: POSIX :: Linux
	Environment :: X11 Applications :: GTK
	Topic :: Multimedia :: Sound/Audio
    Topic :: Multimedia :: Sound/Audio :: Mixers
    Topic :: Software Development :: User Interfaces

[options]
include_package_data = True
packages = find:
python_requires = >=3.10
install_requires =
	pulsectl
	pulsectl_asyncio
	pygobject
	pycairo
	pydantic
package_dir =
	= src

[options.entry_points]
console_scripts = 
	neomixer = neomixer.main:main

[options.packages.find]
where=src

[pylint.MAIN]
init-hook = from gi import require_version; require_version('Gtk', '3.0')
load-plugins = pylint_pydantic
extension-pkg-whitelist = pydantic
fail-under = 8

[pylint.REPORTS]
output-format = colorized

[pylint.DESIGN]
max-args = 10
max-attributes = 10

[pylint.FORMAT]
max-line-length = 150
max-module-lines = 15000

[pylint]
disable = missing-module-docstring, missing-function-docstring, missing-class-docstring, no-member, no-name-in-module, too-few-public-methods

[flake8]
max-line-length = 150

[extract_messages]
keywords = _
input_dirs = src/neomixer
output_file = locale/neomixer.pot
copyright_holder = NeoMixer contributors

[compile_catalog]
domain = neomixer
directory = locale

[init_catalog]
input_file = locale/neomixer.pot
output_dir = locale

[update_catalog]
domain = neomixer
input_file = locale/neomixer.pot
output_dir = locale
